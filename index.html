<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARYA — KRA / KPI Operations Tracking System | Gretex Group</title>

  <!-- Tailwind CSS CDN -->
  <script>
    // Suppress Tailwind CDN production warning
    window.__TAILWIND_CDN_WARN_SUPPRESS = true;
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sidebar: '#0f172a',
            'sidebar-hover': '#1e293b',
            'sidebar-active': '#1d4ed8',
            'sidebar-text': '#94a3b8',
            'sidebar-text-active': '#ffffff',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            'glow-blue': '0 0 20px rgba(37,99,235,0.3)',
          }
        }
      }
    };
  </script>

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <!-- Custom App Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="h-full overflow-hidden bg-slate-50 font-sans antialiased">

  <!-- Global Loader -->
  <div id="global-loader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/40 backdrop-blur-sm" style="display: none !important;">
    <div class="bg-white rounded-2xl p-5 shadow-2xl flex items-center space-x-3 border border-slate-100">
      <div class="w-5 h-5 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-xs font-semibold text-slate-700">Synchronizing workspace...</span>
    </div>
  </div>

  <!-- App Shell: Sidebar + Main Area -->
  <div class="flex h-full overflow-hidden" id="app-shell">

    <!-- ===================== LEFT SIDEBAR ===================== -->
    <aside id="app-sidebar" class="sidebar w-64 min-w-64 flex flex-col h-full overflow-hidden z-30 transition-all duration-300">

      <!-- Sidebar Header: Logo & Branding -->
      <div class="sidebar-header px-5 py-5 border-b border-white/5 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 logo-icon">
          <i class="fa-solid fa-layer-group text-base text-white"></i>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <span class="text-sm font-black tracking-tight text-white">KARYA</span>
            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-md bg-blue-500/20 text-blue-300 border border-blue-500/30 leading-none">v1.1</span>
          </div>
          <span class="text-[10px] text-slate-400 block leading-none mt-0.5">KRA / KPI Tracker</span>
        </div>
      </div>

      <!-- Sidebar Nav Links (injected by App.renderSidebar) -->
      <nav class="flex-1 overflow-y-auto px-3 py-4" id="sidebar-nav">
        <!-- Dynamically rendered based on role -->
      </nav>

      <!-- Sidebar Footer: User Profile & Logout -->
      <div class="sidebar-footer border-t border-white/5 p-3" id="sidebar-user">
        <!-- Injected by renderSidebar -->
      </div>
    </aside>

    <!-- Mobile Sidebar Overlay -->
    <div id="sidebar-overlay" class="fixed inset-0 z-20 bg-black/60 backdrop-blur-sm hidden lg:hidden" onclick="App.closeSidebar()"></div>

    <!-- ===================== MAIN CONTENT AREA ===================== -->
    <div class="flex flex-col flex-1 min-w-0 overflow-hidden">

      <!-- Top Bar -->
      <header class="topbar flex items-center justify-between px-6 h-16 flex-shrink-0 border-b border-slate-200/80 bg-white/80 backdrop-blur-xl z-10">

        <!-- Left: Mobile menu toggle + Page breadcrumb -->
        <div class="flex items-center gap-4">
          <!-- Hamburger (mobile) -->
          <button 
            onclick="App.toggleSidebar()" 
            class="lg:hidden w-9 h-9 flex items-center justify-center rounded-xl hover:bg-slate-100 text-slate-500 transition"
          >
            <i class="fa-solid fa-bars text-sm"></i>
          </button>

          <!-- Page title / breadcrumb injected here -->
          <div id="topbar-breadcrumb" class="text-sm font-semibold text-slate-700"></div>
        </div>

        <!-- Right: Search, Sync, Notifications, User -->
        <div class="flex items-center gap-2">
          <!-- App Working Manual Link -->
          <a 
            href="app-working.html" 
            target="_blank" 
            title="Open App Working Guide & SOP Manual"
            class="hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 text-xs font-semibold transition"
          >
            <i class="fa-solid fa-book-open text-xs"></i>
            <span>App Working Guide</span>
          </a>

          <!-- Sync / Refresh -->
          <button 
            onclick="App.loadInitialData(true)" 
            title="Refresh Data from Google Sheets"
            class="w-9 h-9 flex items-center justify-center rounded-xl hover:bg-slate-100 text-slate-500 hover:text-blue-600 transition"
          >
            <i class="fa-solid fa-rotate text-sm"></i>
          </button>

          <!-- Sync status indicator -->
          <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-emerald-50 border border-emerald-200">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 sync-dot"></span>
            <span class="text-[10px] font-semibold text-emerald-700">Live</span>
          </div>

          <div class="w-px h-5 bg-slate-200 hidden sm:block"></div>

          <!-- User Avatar (Injected) -->
          <div id="navbar-user-section"></div>
        </div>
      </header>

      <!-- Main Content -->
      <main id="app-main-content" class="flex-1 overflow-y-auto p-6 bg-slate-50">
        <!-- Dynamic Component Views render here -->
        <div class="flex items-center justify-center h-full">
          <div class="text-center text-slate-400">
            <div class="w-16 h-16 rounded-2xl bg-slate-100 flex items-center justify-center mx-auto mb-3">
              <i class="fa-solid fa-layer-group text-2xl text-slate-300"></i>
            </div>
            <p class="text-sm font-medium">Loading KARYA...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts in dependency order -->
  <script src="js/config.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/auth.js"></script>
  <script src="js/components/myTasks.js"></script>
  <script src="js/components/kraBuilder.js"></script>
  <script src="js/components/taskAssignment.js"></script>
  <script src="js/components/approvals.js"></script>
  <script src="js/components/projects.js"></script>
  <script src="js/components/dashboards.js"></script>
  <script src="js/components/hierarchy.js"></script>
  <script src="js/components/reports.js"></script>
  <script src="js/components/masterData.js"></script>
  <script src="js/components/csvImport.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
